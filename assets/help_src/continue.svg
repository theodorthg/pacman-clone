<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141225"/><stop offset="1" stop-color="#07060c"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8cd9ff"/>
    </marker>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#fff24d" stroke-opacity="0.20" stroke-width="2"/>
  <text x="450" y="110" font-size="34" fill="#eef4ff" font-weight="700" text-anchor="middle">New maze every few levels</text>
  <rect x="66" y="170" width="130" height="130" rx="14" fill="#4aa5ff" stroke="#1a38d9" stroke-width="5"/>
  <rect x="96" y="200" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="96" y="236" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="96" y="270" width="70" height="14" rx="7" fill="#4a5aaa"/>
  <text x="131" y="340" font-size="20" fill="#8fa3c8" text-anchor="middle">Level 1-2</text>
  <rect x="226" y="170" width="130" height="130" rx="14" fill="#ff9ecc" stroke="#c72673" stroke-width="5"/>
  <rect x="256" y="200" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="256" y="236" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="256" y="270" width="70" height="14" rx="7" fill="#4a5aaa"/>
  <text x="291" y="340" font-size="20" fill="#8fa3c8" text-anchor="middle">Level 3-5</text>
  <rect x="386" y="170" width="130" height="130" rx="14" fill="#73ebe6" stroke="#0d8099" stroke-width="5"/>
  <rect x="416" y="200" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="416" y="236" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="416" y="270" width="70" height="14" rx="7" fill="#4a5aaa"/>
  <text x="451" y="340" font-size="20" fill="#8fa3c8" text-anchor="middle">Level 6-9</text>
  <rect x="546" y="170" width="130" height="130" rx="14" fill="#ffc26b" stroke="#c76100" stroke-width="5"/>
  <rect x="576" y="200" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="576" y="236" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="576" y="270" width="70" height="14" rx="7" fill="#4a5aaa"/>
  <text x="611" y="340" font-size="20" fill="#8fa3c8" text-anchor="middle">Level 10-13</text>
  <rect x="706" y="170" width="130" height="130" rx="14" fill="#9eeb80" stroke="#2e8526" stroke-width="5"/>
  <rect x="736" y="200" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="736" y="236" width="70" height="14" rx="7" fill="#4a5aaa"/><rect x="736" y="270" width="70" height="14" rx="7" fill="#4a5aaa"/>
  <text x="771" y="340" font-size="20" fill="#8fa3c8" text-anchor="middle">Level 14+</text>
  <rect x="40" y="400" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>
  <text x="450" y="455" font-size="32" fill="#eef4ff" font-weight="700" text-anchor="middle">Reaching a new maze unlocks Continue</text>
  <rect x="290" y="500" width="320" height="64" rx="12" fill="#1c2244" stroke="#fff24d" stroke-width="3"/>
  <text x="450" y="543" font-size="28" fill="#fff24d" font-weight="700" text-anchor="middle">Continue (Level 6)</text>
  <text x="450" y="620" font-size="24" fill="#eef4ff" text-anchor="middle">It appears on the start screen and begins a</text>
  <text x="450" y="654" font-size="24" fill="#eef4ff" text-anchor="middle">new game at the first level of the furthest</text>
  <text x="450" y="688" font-size="24" fill="#eef4ff" text-anchor="middle">maze you reached.</text>
  <rect x="40" y="740" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>
  <text x="450" y="795" font-size="26" fill="#fff24d" font-weight="700" text-anchor="middle">Score and lives start fresh</text>
  <text x="450" y="830" font-size="22" fill="#8fa3c8" text-anchor="middle">(with 2 players, both start at that level)</text>
  <rect x="40" y="880" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>
  <text x="450" y="930" text-anchor="middle" font-size="24" font-weight="700" fill="#eef4ff">Every maze has its own ghosts</text>
  <text x="450" y="960" text-anchor="middle" font-size="19" fill="#8fa3c8">faster, pushier, shorter blue time...</text>
</svg>
