<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141225"/><stop offset="1" stop-color="#07060c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#fff24d" stroke-opacity="0.20" stroke-width="2"/>

  <!-- arrow keys cluster -->
  <g transform="translate(210 200)">
    <text x="90" y="-30" text-anchor="middle" font-size="26" fill="#eef4ff" font-weight="700">Arrow Keys</text>
    <g fill="#1c2244" stroke="#4a5480" stroke-width="2">
      <rect x="60" y="0" width="60" height="60" rx="8"/>
      <rect x="0" y="66" width="60" height="60" rx="8"/>
      <rect x="60" y="66" width="60" height="60" rx="8"/>
      <rect x="120" y="66" width="60" height="60" rx="8"/>
    </g>
    <g fill="#eef4ff" font-size="30" text-anchor="middle">
      <text x="90" y="42">^</text>
      <text x="30" y="108">&lt;</text>
      <text x="90" y="108">v</text>
      <text x="150" y="108">&gt;</text>
    </g>
  </g>

  <!-- WASD cluster -->
  <g transform="translate(560 200)">
    <text x="90" y="-30" text-anchor="middle" font-size="26" fill="#eef4ff" font-weight="700">WASD</text>
    <g fill="#1c2244" stroke="#4a5480" stroke-width="2">
      <rect x="60" y="0" width="60" height="60" rx="8"/>
      <rect x="0" y="66" width="60" height="60" rx="8"/>
      <rect x="60" y="66" width="60" height="60" rx="8"/>
      <rect x="120" y="66" width="60" height="60" rx="8"/>
    </g>
    <g fill="#eef4ff" font-size="26" font-weight="700" text-anchor="middle">
      <text x="90" y="38">W</text>
      <text x="30" y="104">A</text>
      <text x="90" y="104">S</text>
      <text x="150" y="104">D</text>
    </g>
  </g>

  <text x="450" y="440" text-anchor="middle" font-size="26" fill="#8fa3c8">turn Pac-Man toward that direction</text>
  <text x="450" y="474" text-anchor="middle" font-size="22" fill="#8fa3c8">works even before reaching the next junction</text>

  <rect x="40" y="520" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>

  <!-- gamepad -->
  <g transform="translate(210 580)">
    <text x="90" y="-14" text-anchor="middle" font-size="26" fill="#eef4ff" font-weight="700">Gamepad</text>

    <!-- D-pad: one solid cross, not four loose squares - reads as a real D-pad at a glance -->
    <g transform="translate(0 15)">
      <path d="M36 0 H72 V36 H108 V72 H72 V108 H36 V72 H0 V36 H36 Z"
            fill="#1c2244" stroke="#4a5480" stroke-width="2" stroke-linejoin="round"/>
      <g fill="#eef4ff" font-size="24" font-weight="700" text-anchor="middle">
        <text x="54" y="28">^</text>
        <text x="54" y="98">v</text>
        <text x="18" y="61">&lt;</text>
        <text x="90" y="61">&gt;</text>
      </g>
    </g>

    <!-- Only "A" is a real bound action (Godot's default ui_accept) - a
         second decorative face button would mismatch real controllers,
         whose diamond layouts disagree on what sits where (Xbox: Y top,
         Nintendo: X top, ...). One clearly-labelled button avoids that. -->
    <g transform="translate(150 55)">
      <circle cx="20" cy="20" r="18" fill="#1c2244" stroke="#4a5480" stroke-width="2"/>
      <text x="20" y="27" text-anchor="middle" font-size="20" fill="#eef4ff" font-weight="700">A</text>
    </g>
  </g>
  <text x="480" y="620" font-size="24" fill="#8fa3c8">D-pad / stick to steer</text>
  <text x="480" y="654" font-size="24" fill="#8fa3c8">A to confirm menus</text>

  <rect x="40" y="720" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>

  <g fill="#1c2244" stroke="#4a5480" stroke-width="2">
    <rect x="330" y="770" width="90" height="50" rx="8"/>
    <rect x="440" y="770" width="90" height="50" rx="8"/>
  </g>
  <text x="375" y="802" text-anchor="middle" font-size="22" fill="#eef4ff">P</text>
  <text x="485" y="802" text-anchor="middle" font-size="18" fill="#eef4ff">Esc</text>
  <text x="450" y="880" text-anchor="middle" font-size="26" font-weight="700" fill="#eef4ff">P, Esc, or the pause button - pause</text>
  <text x="450" y="920" text-anchor="middle" font-size="22" fill="#8fa3c8">a key press aims ahead too, just like a mouse click</text>
</svg>
