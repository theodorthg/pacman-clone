<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141225"/><stop offset="1" stop-color="#07060c"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8cd9ff"/>
    </marker>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#fff24d" stroke-opacity="0.20" stroke-width="2"/>
  <text x="450" y="110" font-size="34" fill="#eef4ff" font-weight="700" text-anchor="middle">Game mode: 2 Players (turns)</text>
  <text x="450" y="148" font-size="22" fill="#8fa3c8" text-anchor="middle">start screen &gt; Multiplayer Settings</text>
  <rect x="40" y="200" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>
  <rect x="80" y="250" width="300" height="230" rx="18" fill="#1c2244" stroke="#ffe14d" stroke-width="3"/>
  <text x="230" y="300" font-size="30" fill="#ffe14d" font-weight="700" text-anchor="middle">PLAYER 1</text>
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/pacman/assets/graphics/help_sprites/pac_right.png" x="198" y="325" width="64" height="64"/>
  <text x="230" y="430" font-size="20" fill="#8fa3c8" text-anchor="middle">own score</text>
  <text x="230" y="458" font-size="20" fill="#8fa3c8" text-anchor="middle">lives, level and board</text>
  <rect x="520" y="250" width="300" height="230" rx="18" fill="#1c2244" stroke="#8cd9ff" stroke-width="3"/>
  <text x="670" y="300" font-size="30" fill="#8cd9ff" font-weight="700" text-anchor="middle">PLAYER 2</text>
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/pacman/assets/graphics/help_sprites/pac_up_open.png" x="638" y="325" width="64" height="64"/>
  <text x="670" y="430" font-size="20" fill="#8fa3c8" text-anchor="middle">own score</text>
  <text x="670" y="458" font-size="20" fill="#8fa3c8" text-anchor="middle">lives, level and board</text>
  <g stroke="#8cd9ff" stroke-width="6" fill="none">
    <path d="M395 330 L505 330" marker-end="url(#ah)"/>
    <path d="M505 400 L395 400" marker-end="url(#ah)"/>
  </g>
  <rect x="40" y="530" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>
  <text x="450" y="585" font-size="26" fill="#eef4ff" text-anchor="middle">After you lose a life, the other player continues</text>
  <text x="450" y="620" font-size="22" fill="#8fa3c8" text-anchor="middle">("P2 READY!"). Everyone keeps his own progress.</text>
  <rect x="40" y="670" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>
  <text x="450" y="725" font-size="26" fill="#eef4ff" text-anchor="middle">A player with no lives left is out - the other</text>
  <text x="450" y="760" font-size="26" fill="#eef4ff" text-anchor="middle">one keeps going. Both scores reach the Hall of Fame.</text>
  <rect x="40" y="810" width="820" height="2" fill="#fff24d" fill-opacity="0.18"/>
  <text x="450" y="860" text-anchor="middle" font-size="26" fill="#fff24d" font-weight="700">Each on their own device?</text>
  <text x="450" y="896" text-anchor="middle" font-size="22" fill="#8fa3c8">Multiplayer Settings &gt; Online (code) or Wi-Fi / LAN.</text>
  <text x="450" y="928" text-anchor="middle" font-size="22" fill="#8fa3c8">You watch the other's score while waiting.</text>
</svg>
